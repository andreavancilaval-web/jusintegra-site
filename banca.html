    :root {
      --teal: #03989E;
      --teal-escuro: #027378;
      --teal-claro: #E3F4F4;
      --teal-borda: #CDE7E8;
      --fundo: #F4F8F8;
      --card: #FFFFFF;
      --texto: #10282A;
      --suave: #5E7476;
      --sombra: 0 1px 2px rgba(3,60,62,.06), 0 4px 14px rgba(3,60,62,.06);
      --titulo: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
      --corpo: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--fundo); color: var(--texto);
      font-family: var(--corpo); line-height: 1.45; -webkit-font-smoothing: antialiased;
    }
    svg.i { width: 20px; height: 20px; flex: 0 0 auto; }

    .i { width: 20px; height: 20px; flex: 0 0 auto; }

    /* ---------- Cabeçalho ---------- */
    .faixa {
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.14) 0 2px, transparent 3px) 0 0 / 26px 26px,
        linear-gradient(135deg, var(--teal) 0%, var(--teal-escuro) 100%);
      color: #fff;
    }
    .faixa-in { max-width: 980px; margin: 0 auto; padding: 14px 18px 22px; }
    .voltar {
      display: inline-flex; align-items: center; gap: 6px; color: #fff; text-decoration: none;
      font: 600 14px var(--corpo); opacity: .92; padding: 6px 10px 6px 6px; border-radius: 999px;
    }
    .voltar:hover { background: rgba(255,255,255,.14); opacity: 1; }
    .marca { display: flex; align-items: center; gap: 16px; margin-top: 10px; }
    .marca .av {
      width: 74px; height: 74px; border-radius: 50%; background: #fff; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(0,0,0,.18);
    }
    .marca .av img { width: 44px; }
    .marca h1 { font-family: var(--titulo); font-weight: 800; font-size: 34px; letter-spacing: .04em; margin: 0; line-height: 1; }
    .marca p { margin: 6px 0 0; font-size: 15px; opacity: .92; }

    .container { max-width: 980px; margin: 0 auto; padding: 0 18px 48px; }

    /* ---------- Busca ---------- */
    .busca { position: sticky; top: 0; z-index: 10; background: var(--fundo); padding: 16px 0 10px; }
    .campo { position: relative; }
    .campo > svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--teal); }
    .campo input {
      width: 100%; padding: 15px 46px; font: 500 16px var(--corpo); color: var(--texto);
      border: 2px solid var(--teal-borda); border-radius: 16px; background: var(--card);
      outline: none; box-shadow: var(--sombra); transition: border-color .15s ease, box-shadow .15s ease;
    }
    .campo input::placeholder { color: #8FA3A5; }
    .campo input:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(3,152,158,.15); }
    input[type=search]::-webkit-search-cancel-button, input[type=search]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
    .limpar {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      border: 0; background: var(--teal-claro); color: var(--teal-escuro); cursor: pointer;
      width: 30px; height: 30px; border-radius: 50%; display: none; font-size: 18px; line-height: 1;
    }

    /* ---------- Trilha (breadcrumb) ---------- */
    .trilha-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0 4px; flex-wrap: wrap; }
    .trilha { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; font-family: var(--titulo); font-weight: 700; font-size: 22px; letter-spacing: .02em; }
    .trilha a, .trilha span { color: var(--teal-escuro); text-decoration: none; padding: 2px 6px; border-radius: 8px; }
    .trilha a:hover { background: var(--teal-claro); }
    .trilha span.atual { color: var(--texto); }
    .trilha .sep { color: #A9BCBD; padding: 0; }
    .trilha .sep svg { width: 18px; height: 18px; vertical-align: -3px; }
    .no-drive {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      font: 600 13.5px var(--corpo); color: var(--teal-escuro); background: var(--card);
      border: 1.5px solid var(--teal-borda); padding: 7px 12px; border-radius: 999px;
    }
    .no-drive:hover { border-color: var(--teal); }
    .no-drive svg { width: 16px; height: 16px; }

    .secao { font-family: var(--titulo); font-weight: 700; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--suave); margin: 22px 4px 10px; }

    /* ---------- Pastas ---------- */
    .pastas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .pasta {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px;
      background: var(--card); box-shadow: var(--sombra); border: 1.5px solid transparent;
      text-decoration: none; color: var(--texto); font-weight: 600; font-size: 15.5px;
      transition: transform .15s ease, border-color .15s ease;
    }
    button.pasta { font-family: var(--corpo); text-align: left; cursor: pointer; width: 100%; }
    .trilha button { font: inherit; letter-spacing: inherit; color: var(--teal-escuro); background: none; border: 0; cursor: pointer; padding: 2px 6px; border-radius: 8px; }
    .trilha button:hover { background: var(--teal-claro); }
    .pasta svg { width: 26px; height: 26px; color: var(--teal); fill: var(--teal-claro); }
    .pasta span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pasta:hover, .pasta:focus-visible { transform: translateY(-2px); border-color: var(--teal); outline: none; }

    /* ---------- Filtros ---------- */
    .filtros { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
    .filtros::-webkit-scrollbar { display: none; }
    .filtros button {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
      border: 1.5px solid var(--teal-borda); background: var(--card); color: var(--texto);
      padding: 6px 13px 6px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; font: 600 13px var(--corpo);
    }
    .filtros button i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .filtros button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }

    /* ---------- Arquivos ---------- */
    .arquivos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
    .arq {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 14px;
      background: var(--card); box-shadow: var(--sombra); border: 1.5px solid transparent;
      text-decoration: none; color: var(--texto); min-width: 0;
      transition: transform .15s ease, border-color .15s ease;
    }
    .arq:hover, .arq:focus-visible { transform: translateY(-2px); border-color: var(--teal); outline: none; }
    .tipo {
      width: 44px; height: 44px; border-radius: 11px; flex: 0 0 auto; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .tipo svg { width: 21px; height: 21px; }
    .tipo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .arq .txt { flex: 1; min-width: 0; }
    .arq strong {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      font-size: 14.5px; font-weight: 600; line-height: 1.3; word-break: break-word;
    }
    .arq small { display: block; margin-top: 3px; font-size: 12.5px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .arq small b { font-weight: 600; }
    .arq .seta { color: #A9BCBD; flex: 0 0 auto; }
    .arq:hover .seta { color: var(--teal); }

    .indice {
      display: flex; align-items: center; gap: 14px; margin: 14px 0 4px; padding: 14px 16px; border-radius: 16px;
      text-decoration: none; color: #fff; background: linear-gradient(135deg, var(--teal), var(--teal-escuro));
      box-shadow: 0 8px 22px rgba(2,115,120,.22); transition: transform .15s ease;
    }
    .indice:hover { transform: translateY(-2px); }
    .indice-ic { width: 46px; height: 46px; border-radius: 12px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .indice-ic svg { width: 24px; height: 24px; }
    .indice-txt { flex: 1; min-width: 0; }
    .indice-txt strong { display: block; font: 800 20px var(--titulo); letter-spacing: .05em; text-transform: uppercase; }
    .indice-txt small { display: block; font-size: 13.5px; opacity: .92; margin-top: 2px; }
    .indice .seta { color: #fff; }
    .mais {
      display: block; margin: 16px auto 0; border: 2px solid var(--teal); background: transparent; color: var(--teal);
      font: 700 17px var(--titulo); letter-spacing: .05em; text-transform: uppercase; padding: 11px 26px; border-radius: 14px; cursor: pointer;

        img.onerror = () => img.remove();
        img.src = "https://drive.google.com/thumbnail?id=" + it.id + "&sz=w120";
        tipo.append(img);
      }
      const txt = el("span", "txt");
      txt.append(el("strong", null, it.titulo));
      const sm = el("small");
      const b = el("b", null, it.ext ? it.ext.toUpperCase() : t.rot); b.style.color = t.cor;
      sm.append(b);
      if (comCaminho) {
        const c = caminho(it.i).slice(1).map(p => ITENS[p].titulo).join(" › ");
        sm.append(" · " + (c || "JUSINTEGRA Banca"));
      }
      txt.append(sm);
      a.append(tipo, txt, icone("arrow-up-right", "seta"));
      return a;
    }

    function botaoMais(restam, acao) {
      const b = el("button", "mais", "Mostrar mais (" + restam.toLocaleString("pt-BR") + ")");
      b.type = "button"; b.addEventListener("click", acao);
      return b;
    }

    // ---------- Navegação por pastas ----------
    function renderPasta() {
      const it = ITENS[pastaAtual];
      $c.replaceChildren();

      const bar = el("div", "trilha-bar");
      const tr = el("nav", "trilha"); tr.setAttribute("aria-label", "Caminho");
      [...caminho(pastaAtual), pastaAtual].forEach((p, n, arr) => {
        if (n) { const s = el("span", "sep"); s.append(icone("chevron-right")); tr.append(s); }
        if (p === pastaAtual) tr.append(el("span", "atual", ITENS[p].titulo));
        else { const a = el("button", null, ITENS[p].titulo); a.type = "button"; a.addEventListener("click", () => irPara(p)); tr.append(a); }
      });
      const nd = el("a", "no-drive"); nd.href = it.url; nd.target = "_blank"; nd.rel = "noopener noreferrer";
      nd.append(icone("external-link"), "Abrir no Drive");
      bar.append(tr, nd);
      $c.append(bar);

      const filhos = FILHOS[pastaAtual];
      const indice = filhos.find(i => ITENS[i].tipo !== "pasta" && /^0*\s*-?\s*[ií]ndice\b/i.test(norm(ITENS[i].titulo).replace(/^0+\s*-\s*/, "")));
      if (indice != null) {
        const a = el("a", "indice"); a.href = ITENS[indice].url; a.target = "_blank"; a.rel = "noopener noreferrer";
        const ic = el("span", "indice-ic"); ic.append(icone("list-ordered"));
        const tx = el("span", "indice-txt");
        tx.append(el("strong", null, "Índice desta pasta"), el("small", null, "Consulte o número da peça pelo tipo de ação e abra a petição correspondente abaixo."));
        a.append(ic, tx, icone("arrow-up-right", "seta"));
        $c.append(a);
      }
      const pastas = filhos.filter(i => ITENS[i].tipo === "pasta");
      const arqs = filhos.filter(i => ITENS[i].tipo !== "pasta");

      if (pastas.length) {
        $c.append(el("h2", "secao", "Pastas"));
        const g = el("div", "pastas"); pastas.forEach(i => g.append(cardPasta(ITENS[i]))); $c.append(g);
      }
      if (arqs.length) {
        $c.append(el("h2", "secao", "Arquivos"));
        const tiposAqui = [...new Set(arqs.map(i => ITENS[i].tipo))];
        if (tiposAqui.length > 1) {
          const f = el("div", "filtros"); f.setAttribute("role", "toolbar"); f.setAttribute("aria-label", "Filtrar por tipo");
          ["todos", ...Object.keys(TIPOS).filter(t => tiposAqui.includes(t))].forEach(t => {
            const b = el("button"); b.type = "button";
            if (t !== "todos") { const q = el("i"); q.style.background = TIPOS[t].cor; b.append(q); }
            b.append(t === "todos" ? "Todos" : TIPOS[t].rot);
            b.setAttribute("aria-pressed", t === filtroTipo ? "true" : "false");
            b.addEventListener("click", () => { filtroTipo = t; mostrar = LOTE; renderPasta(); });
            f.append(b);
          });
          $c.append(f);
        }
        const lista = arqs.filter(i => filtroTipo === "todos" || ITENS[i].tipo === filtroTipo);
        const g = el("div", "arquivos");
        lista.slice(0, mostrar).forEach(i => g.append(cardArquivo(ITENS[i], false)));
        $c.append(g);
        if (lista.length > mostrar) $c.append(botaoMais(lista.length - mostrar, () => { mostrar += LOTE * 2; renderPasta(); }));
      }
      if (!filhos.length) $c.append(el("div", "vazio", "Esta pasta está vazia."));
    }

    // ---------- Busca em toda a Banca ----------
    function dist1(a, b) {
      if (Math.abs(a.length - b.length) > 1) return false;
      let i = 0, j = 0, e = 0;
      while (i < a.length && j < b.length) {
        if (a[i] === b[j]) { i++; j++; continue; }
        if (++e > 1) return false;
        if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
      }
      return e + (a.length - i) + (b.length - j) <= 1;
    }
    let resultadoBusca = [];
    function buscar(texto) {
      const q = tokens(texto);
      if (!q.length) return null;
      const res = [];
      for (let i = 1; i < ITENS.length; i++) {
        const tk = TOK[i]; let total = 0, ok = true;
        for (const t of q) {
          let melhor = 0;
          for (const w of tk) {
            if (w === t) { melhor = 3; break; }
            if (w.startsWith(t)) melhor = Math.max(melhor, 2);
            else if (t.length >= 5 && melhor < 1 && dist1(w, t)) melhor = 1;
          }
          if (!melhor) { ok = false; break; }
          total += melhor;
        }
        if (ok) res.push([i, total + (ITENS[i].tipo === "pasta" ? 2 : 0)]);
      }
      res.sort((a, b) => b[1] - a[1] || ordem(a[0], b[0]));
      return res.map(r => r[0]);
    }
    function renderBusca() {
      $c.replaceChildren();
      const bar = el("div", "trilha-bar");
      const tr = el("div", "trilha"); tr.append(el("span", "atual", "Resultados da busca"));
      bar.append(tr); $c.append(bar);
      if (!resultadoBusca.length) {
        $c.append(el("div", "vazio", "Nada encontrado. Tente outra palavra ou navegue pelas pastas."));
        return;
      }
      const pastas = resultadoBusca.filter(i => ITENS[i].tipo === "pasta");
      const arqs = resultadoBusca.filter(i => ITENS[i].tipo !== "pasta");
      if (pastas.length) {
        $c.append(el("h2", "secao", "Pastas"));
        const g = el("div", "pastas"); pastas.forEach(i => g.append(cardPasta(ITENS[i]))); $c.append(g);
      }
      if (arqs.length) {
        $c.append(el("h2", "secao", "Arquivos"));
        const g = el("div", "arquivos");
        arqs.slice(0, mostrar).forEach(i => g.append(cardArquivo(ITENS[i], true)));
        $c.append(g);
        if (arqs.length > mostrar) $c.append(botaoMais(arqs.length - mostrar, () => { mostrar += LOTE * 2; renderBusca(); }));
      }
    }

    // ---------- Roteamento ----------
    let timer;
    function atualizar() {
      $limpar.style.display = $q.value ? "block" : "none";
      const r = buscar($q.value);
      mostrar = LOTE;
      if (r === null) renderPasta(); else { resultadoBusca = r; renderBusca(); }
    }
    $q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(atualizar, 120); });
    $limpar.addEventListener("click", () => { $q.value = ""; atualizar(); $q.focus(); });
    document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $q) { e.preventDefault(); $q.focus(); } });

    function abrir(n) {
      pastaAtual = ITENS[n] && ITENS[n].tipo === "pasta" ? n : 0;
      filtroTipo = "todos"; mostrar = LOTE;
      if ($q.value) { $q.value = ""; $limpar.style.display = "none"; }
      renderPasta();
      const topo = document.querySelector(".busca");
      if (window.scrollY > topo.offsetTop) window.scrollTo({ top: topo.offsetTop });
    }
    function irPara(n) {
      abrir(n);
      try { history.pushState(null, "", n ? "#p" + n : location.pathname); } catch (e) {}
    }
    function lerEndereco() {
      let n = 0;
      try { const m = location.hash.match(/^#p(\d+)$/); if (m) n = +m[1]; } catch (e) {}
      abrir(n);
    }
    window.addEventListener("popstate", lerEndereco);
    window.addEventListener("hashchange", lerEndereco);
    lerEndereco();
  </script>
</body>
</html>
